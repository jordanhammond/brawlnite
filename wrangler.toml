# Cloudflare Worker: serves dist/ (the game) and /api/* (high scores). See README "Put it online".
name = "brawlnite"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true   # keep the old workers.dev address working too

# Custom domain on the boys' mattlucas.live zone (Cloudflare creates the DNS record + HTTPS cert)
routes = [
  { pattern = "brawlnite.mattlucas.live", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "brawlnite"
database_id = "0d904fa1-d1f5-4a49-bd2e-21452c10ca83"
